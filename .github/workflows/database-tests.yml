# Runs the database tests on every push. Shows a green tick when everything
# passes and a red cross when anything fails.
# It can also be started by hand from the Actions tab (Run workflow).
name: Database tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A clean, temporary PostgreSQL that exists only for this run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Make sure the PostgreSQL client is available
        run: |
          command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          psql --version

      - name: Load the stand-in for Supabase (test database only)
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/_stub_supabase.sql

      - name: Apply every migration, in order
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Run every test
        run: |
          for t in supabase/tests/*.test.sql; do
            echo "Running $t"
            psql -v ON_ERROR_STOP=1 -q -f "$t"
          done

      - name: Get Node.js (for the GitHub checker test)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run the GitHub checker test (real database, pretend GitHub)
        run: node --experimental-strip-types supabase/functions/github-sync/sync.test.mjs

      - name: Run the file cleanup test (real database, pretend Storage)
        run: node --experimental-strip-types supabase/functions/file-cleanup/cleanup.test.mjs
      - name: Run the quest runner test (real database, pretend code runner)
        run: node --experimental-strip-types supabase/functions/run-quest/run.test.mjs

      - name: Run the content import tool test
        run: node --test tools/import-content.test.mjs

      - name: Run the E2B runner test (real python and node, pretend E2B)
        run: node --experimental-strip-types supabase/functions/e2b-runner/runner.test.mjs

      - name: Run the job-alert e-mail test (pretend database, pretend e-mail service)
        run: node --experimental-strip-types supabase/functions/job-digest/digest.test.mjs

      - name: Run the account purge test (pretend database, pretend Storage)
        run: node --experimental-strip-types supabase/functions/account-purge/purge.test.mjs

      - name: Run the code editor test (pretend database, pretend GitHub)
        run: node --experimental-strip-types supabase/functions/repo-editor/editor.test.mjs

      - name: Run the file info test (pretend database, pretend GitHub)
        run: node --experimental-strip-types supabase/functions/repo-info/info.test.mjs

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
        env:
          # The suite is large now: the default memory of node ran out on the GitHub machine.
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Build
        run: npm run build
        env:
          # The build also needs more memory than the default on the GitHub machine.
          NODE_OPTIONS: --max-old-space-size=4096
